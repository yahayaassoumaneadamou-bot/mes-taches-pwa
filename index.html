<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes tâches</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101314">
<style>
  :root {
    --bg: #101314;
    --card: #171b1c;
    --accent: #5eead4;
    --text: #eef2f1;
    --muted: #8a9694;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    color: var(--text);
  }
  .app { width: 100%; max-width: 420px; }
  h1 { font-size: 22px; letter-spacing: 0.02em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type="text"] {
    flex: 1; background: var(--card); border: 1px solid #262b2c;
    border-radius: 10px; padding: 12px 14px; color: var(--text);
    font-size: 15px; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button.add {
    background: var(--accent); color: #06201b; border: none;
    border-radius: 10px; padding: 0 18px; font-weight: 600;
    font-size: 20px; cursor: pointer;
  }
  .stats { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  ul.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li.task {
    background: var(--card); border: 1px solid #21262a; border-radius: 10px;
    padding: 12px 14px; display: flex; align-items: center; gap: 10px;
  }
  .check {
    width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted);
    flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .check.done { background: var(--accent); border-color: var(--accent); color: #06201b; font-size: 13px; }
  .task-text { flex: 1; font-size: 15px; }
  .task-text.done { color: var(--muted); text-decoration: line-through; }
  .del { background: none; border: none; color: var(--danger); font-size: 16px; cursor: pointer; opacity: 0.6; }
  .del:hover { opacity: 1; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<div class="app">
  <h1>Mes tâches</h1>
  <div class="sub">Démo — exemple d'app fonctionnelle</div>
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Ajouter une tâche...">
    <button class="add" id="addBtn">+</button>
  </div>
  <div class="stats" id="stats"></div>
  <ul class="tasks" id="taskList"></ul>
</div>
<script>
  let tasks = [
    { text: "Ouvrir MIT App Inventor", done: true },
    { text: "Créer un nouveau projet", done: true },
    { text: "Ajouter les composants", done: false },
    { text: "Générer l'APK", done: false }
  ];
  const listEl = document.getElementById('taskList');
  const statsEl = document.getElementById('stats');
  const inputEl = document.getElementById('taskInput');
  function render() {
    listEl.innerHTML = '';
    if (tasks.length === 0) {
      listEl.innerHTML = '<div class="empty">Aucune tâche. Ajoute la première !</div>';
    }
    tasks.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = 'task';
      li.innerHTML = `
        <div class="check ${t.done ? 'done' : ''}" data-i="${i}">${t.done ? '✓' : ''}</div>
        <div class="task-text ${t.done ? 'done' : ''}">${t.text}</div>
        <button class="del" data-i="${i}">✕</button>
      `;
      listEl.appendChild(li);
    });
    const doneCount = tasks.filter(t => t.done).length;
    statsEl.textContent = `${doneCount} / ${tasks.length} terminées`;
    listEl.querySelectorAll('.check').forEach(el => {
      el.addEventListener('click', () => {
        tasks[el.dataset.i].done = !tasks[el.dataset.i].done;
        render();
      });
    });
    listEl.querySelectorAll('.del').forEach(el => {
      el.addEventListener('click', () => {
        tasks.splice(el.dataset.i, 1);
        render();
      });
    });
  }
  document.getElementById('addBtn').addEventListener('click', addTask);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  function addTask() {
    const val = inputEl.value.trim();
    if (!val) return;
    tasks.push({ text: val, done: false });
    inputEl.value = '';
    render();
  }
  render();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
